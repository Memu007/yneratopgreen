<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C · Precisión productiva — TopGreen (exploración)</title>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/c.css">
</head>
<body>

<header class="hd">
  <div class="hd-in">
    <button class="brand" type="button">
      <img src="../assets/marca/topgreen-c.svg" alt="TopGreen" width="431" height="112">
    </button>
    <nav class="nav" aria-label="Secciones del sitio">
      <button class="nav-link is-active" type="button" aria-current="page"><i>01</i><span>Inicio</span></button>
      <button class="nav-link" type="button"><i>02</i><span>Mercado</span></button>
      <button class="nav-link" type="button"><i>03</i><span>Servicios</span></button>
      <button class="nav-link" type="button"><i>04</i><span>Quiénes somos</span></button>
      <button class="nav-link" type="button"><i>05</i><span>Contacto</span></button>
    </nav>
    <div class="acciones">
      <button class="ingresar" type="button">Ingresar</button>
    </div>
  </div>
</header>

<main>
  <section class="hero" aria-labelledby="titulo-inicio">
    <div class="hero-copy">
      <p class="eyebrow"><b>Mercado agro · Argentina</b></p>
      <h1 id="titulo-inicio" class="titulo">Equipos, insumos y servicios para seguir produciendo.</h1>
      <p class="lead">Publicaciones con precio o modalidad, ubicación, responsable y próximo paso.</p>
      <div class="acciones-hero">
        <button class="btn btn-primary" type="button">Explorar operaciones</button>
        <button class="btn btn-secondary" type="button">Publicar una oferta</button>
      </div>
      <div class="medidor">
        <p class="medidor-label"><span>Operaciones publicadas</span><span>ARG · Mercado agro</span></p>
        <div class="medidor-row">
          <span class="medidor-num">30</span>
          <span class="medidor-txt">operaciones disponibles ahora</span>
        </div>
        <div class="medidor-regla" aria-hidden="true"></div>
      </div>
    </div>
    <div class="hero-foto">
      <img src="../assets/media/home-cosecha-hero-1920.webp" alt="Cosecha y descarga de grano en un campo argentino" width="1920" height="1080">
      <i class="reg tl" aria-hidden="true"></i>
      <i class="reg br" aria-hidden="true"></i>
      <div class="foto-cap"><span>Registro · Cosecha y descarga de grano · Campo argentino</span></div>
    </div>
  </section>
</main>

</body>
</html>
