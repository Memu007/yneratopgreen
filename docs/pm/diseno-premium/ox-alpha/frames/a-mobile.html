<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A · Operación de campo — móvil 390 — TopGreen (exploración)</title>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/a.css">
</head>
<body>

<header class="hd">
  <div class="hd-in">
    <button class="brand" type="button">
      <img src="../assets/marca/topgreen-a.svg" alt="TopGreen" width="431" height="112">
    </button>
    <div class="acciones">
      <button class="ingresar" type="button">Ingresar</button>
    </div>
    <nav class="nav" aria-label="Secciones del sitio">
      <button class="nav-link is-active" type="button" aria-current="page">Inicio</button>
      <button class="nav-link" type="button">Mercado</button>
      <button class="nav-link" type="button">Servicios</button>
      <button class="nav-link" type="button">Quiénes somos</button>
      <button class="nav-link" type="button">Contacto</button>
    </nav>
  </div>
</header>

<main>
  <section class="hero" aria-labelledby="titulo-inicio">
    <div class="hero-copy">
      <p class="eyebrow">Mercado agro · Argentina</p>
      <h1 id="titulo-inicio" class="titulo">Equipos, insumos y servicios para seguir produciendo.</h1>
      <p class="lead">Publicaciones con precio o modalidad, ubicación, responsable y próximo paso.</p>
      <div class="acciones-hero">
        <button class="btn btn-primary" type="button">Explorar operaciones</button>
        <button class="btn btn-secondary" type="button">Publicar una oferta</button>
      </div>
      <div class="medidor">
        <span class="medidor-num">30</span>
        <span class="medidor-txt">Operaciones disponibles ahora</span>
        <div class="medidor-regla" aria-hidden="true"></div>
      </div>
    </div>
    <div class="hero-foto">
      <img src="../assets/media/home-cosecha-hero-1200.webp" alt="Cosecha y descarga de grano en un campo argentino" width="1200" height="900">
      <div class="foto-banda">
        <span>Cosecha y descarga de grano</span>
        <i aria-hidden="true"></i>
      </div>
    </div>
  </section>

  <div class="horizonte" aria-hidden="true"><i></i><i></i><i></i></div>
</main>

</body>
</html>
