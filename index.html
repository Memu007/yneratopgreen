<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/topG.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Decía «de forma segura». TopGreen no custodia el dinero ni garantiza la
         operación, así que prometerlo en la descripción del sitio es
         exactamente el claim que el sistema tiene prohibido. -->
    <meta name="description" content="TopGreen, mercado agro argentino: productos, servicios y logística con precio o modalidad, ubicación y responsable." />
    <meta name="theme-color" content="#17213d" />
    <title>TopGreen — Mercado agro</title>
    <!-- Las dos familias se sirven desde el propio sitio y se precargan acá:
         sin esto el navegador las descubre recién al parsear el CSS y el
         primer pintado sale con la tipografía de respaldo. No hay pedido a
         Google Fonts: contar al visitante ante un tercero para dibujar una
         letra no es un intercambio que el visitante haya aceptado. -->
    <link rel="preload" href="/fuentes/WorkSans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fuentes/Newsreader.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
