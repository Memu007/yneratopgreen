services:
  # Base de datos PostgreSQL con PostGIS
  db:
    image: postgis/postgis:16-3.4
    container_name: topgreen-db
    environment:
      POSTGRES_DB: "${DB_NAME:?DB_NAME no está definido en .env}"
      POSTGRES_USER: "${DB_USER:?DB_USER no está definido en .env}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD no está definido en .env}"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infra/postgres/init/99_topgreen_postgis_only.sh:/docker-entrypoint-initdb.d/99_topgreen_postgis_only.sh:ro
    ports:
      - "${DB_EXPOSED_PORT:-5433}:5432"
    networks:
      - topgreen-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Backend FastAPI
  topgreen-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: topgreen-api
    env_file:
      # Configuración de la aplicación. Las claves de abajo la pisan, para
      # que el contenedor no dependa de cómo quedó el .env del backend.
      - ./backend/.env
    # `host-gateway` es la capacidad nativa de Compose para que el contenedor
    # alcance a la máquina que lo hospeda. Funciona igual en Docker Desktop y en
    # Linux, y no depende de que el host tenga una IP fija.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: "postgresql+psycopg://${DB_USER:?DB_USER no está definido en .env}:${DB_PASSWORD:?DB_PASSWORD no está definido en .env}@db:5432/${DB_NAME:?DB_NAME no está definido en .env}"
      UPLOAD_DIR: /data/uploads
      # Las constancias fiscales NO pueden caer adentro de `/data/uploads`, que
      # se sirve entero como estatico publico —la aplicacion se niega a
      # arrancar si pasa—. Y la carpeta por defecto, `/app/documentos`, no es
      # escribible por `appuser`: eran diez casos en rojo con `PermissionError`.
      # Va a su propio volumen, privado y hermano del publico.
      DOCUMENTOS_DIR: /data/documentos
      # El doble local de Mercado Pago que levanta la suite corre en el HOST, y
      # `127.0.0.1` adentro del contenedor es el contenedor: la API no llegaba.
      #
      # Se pisa SÓLO la base de API, que es la que usa el servidor para hablar
      # con Mercado Pago. `MP_AUTH_BASE_URL` NO se toca: con ella se arma la
      # URL de autorización que se le devuelve al NAVEGADOR, y el navegador
      # corre en el host, que no resuelve `host.docker.internal`. Pisar las dos
      # rompía los casos 62 a 66 con `fetch failed`. La de autorización sigue
      # saliendo de backend/.env, en loopback.
      MP_API_BASE_URL: "${MP_BASE_DEL_DOBLE:-http://host.docker.internal:8099}"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app  # Hot reload en desarrollo
      - ./backend/alembic:/app/alembic
      - uploads_data:/data/uploads
      - documentos_data:/data/documentos
      # El outbox de correo se comparte con el host para que la suite lea
      # el enlace de confirmacion sin ningun endpoint de prueba.
      - ./backend/outbox:/app/outbox
    depends_on:
      db:
        condition: service_healthy
    networks:
      - topgreen-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Nginx (OPCIONAL - Reverse Proxy + Frontend buildado)
  # Sólo necesario si querés servir el frontend buildado en :80 a través de nginx.
  # Para desarrollo, usá `npm run dev` (Vite en :5173) — no necesitás este servicio.
  # Antes de levantarlo: ejecutá `npm run build` para generar ./dist
  # Activarlo con: `docker compose --profile fullstack up -d`
  nginx:
    image: nginx:alpine
    container_name: topgreen-nginx
    profiles: ["fullstack"]
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./dist:/usr/share/nginx/html:ro  # Requiere `npm run build` previo
      - uploads_data:/usr/share/nginx/html/uploads:ro
    depends_on:
      - topgreen-api
    networks:
      - topgreen-network
    restart: unless-stopped

networks:
  topgreen-network:
    driver: bridge

volumes:
  db_data:
    driver: local
  uploads_data:
    driver: local
  # Privado: no lo monta nginx ni ningun otro servicio.
  documentos_data:
    driver: local
