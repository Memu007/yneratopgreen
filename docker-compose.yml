services:
  # Base de datos PostgreSQL con PostGIS
  db:
    image: postgis/postgis:16-3.4
    container_name: topgreen-db
    environment:
      POSTGRES_DB: "${DB_NAME:?DB_NAME no está definido en .env}"
      POSTGRES_USER: "${DB_USER:?DB_USER no está definido en .env}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD no está definido en .env}"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infra/postgres/init/99_topgreen_postgis_only.sh:/docker-entrypoint-initdb.d/99_topgreen_postgis_only.sh:ro
    ports:
      - "${DB_EXPOSED_PORT:-5433}:5432"
    networks:
      - topgreen-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Backend FastAPI
  topgreen-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: topgreen-api
    env_file:
      # Configuración de la aplicación. Las claves de abajo la pisan, para
      # que el contenedor no dependa de cómo quedó el .env del backend.
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql+psycopg://${DB_USER:?DB_USER no está definido en .env}:${DB_PASSWORD:?DB_PASSWORD no está definido en .env}@db:5432/${DB_NAME:?DB_NAME no está definido en .env}"
      UPLOAD_DIR: /data/uploads
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app  # Hot reload en desarrollo
      - ./backend/alembic:/app/alembic
      - uploads_data:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - topgreen-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Nginx (OPCIONAL - Reverse Proxy + Frontend buildado)
  # Sólo necesario si querés servir el frontend buildado en :80 a través de nginx.
  # Para desarrollo, usá `npm run dev` (Vite en :5173) — no necesitás este servicio.
  # Antes de levantarlo: ejecutá `npm run build` para generar ./dist
  # Activarlo con: `docker compose --profile fullstack up -d`
  nginx:
    image: nginx:alpine
    container_name: topgreen-nginx
    profiles: ["fullstack"]
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./dist:/usr/share/nginx/html:ro  # Requiere `npm run build` previo
      - uploads_data:/usr/share/nginx/html/uploads:ro
    depends_on:
      - topgreen-api
    networks:
      - topgreen-network
    restart: unless-stopped

networks:
  topgreen-network:
    driver: bridge

volumes:
  db_data:
    driver: local
  uploads_data:
    driver: local
